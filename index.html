<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student management system</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
    <section id="registration">
    <h2>Register  Student</h2>
    <form id="studentForm">

    <!-- Student Name -->
    <label for="name">Student Name:</label>
    <input type="text" id="name" name="name" required>

    <!-- Email -->

    <label for="email">Email:</label>
    <input type="email" id="email" name="email" required>

    <!-- Phone Number -->
    <label for="phone">Phone Number:</label>
    <input type="text" id="phone" name="phone" required>

    <!-- Date of Birth -->

    <label for="dob">Date of Birth:</label>

    <input type="date" id="dob" name="dob" required>

    <!-- Gender -->
    <fieldset>
        <legend>Gender:</legend>

        <label><input type="radio" name="gender" value="Male"> Male</label>
        <label><input type="radio" name="gender" value="Female"> Female</label>

        <label><input type="radio" name="gender" value="Other"> Other</label>
    </fieldset>

    <!-- Course -->
    <label for="course">Course:</label>
    <select id="course" name="course" required>
        <option value="">Select Course</option>
        <option value="Web Development">Web Development</option>
        <option value="UI/UX">UI/UX</option>

        <option value="Python">Python</option>
        <option value="Data Analytics">Data Analytics</option>


        <option value="MERN Stack">Mern Stack</option>
        <option value="Cloud Computing">Cloud Computing</option>
    </select>

    <!-- Skills -->
    <fieldset>
        <legend>Skills:</legend>
        <label><input type="checkbox" name="skills" value="HTML"> HTML</label>
        <label><input type="checkbox" name="skills" value="CSS"> CSS</label>

        <label><input type="checkbox" name="skills" value="JavaScript"> JavaScript</label>
        <label><input type="checkbox" name="skills" value="Git"> Git</label>

        <label><input type="checkbox" name="skills" value="React"> React</label>
        <label><input type="checkbox" name="skills" value="Node.js"> Node.js</label>
    </fieldset>

    <!-- About Student -->
    <label for="about">About Student:</label>
    <textarea id="about" name="about" maxlength="200" required></textarea>
    <small id="charCount">0 / 200</small>

    <!-- Profile Photo -->
    <label for="photo">Profile Photo:</label>
    <input type="file" id="photo" name="photo" accept="image/*" required>

    <!-- Buttons -->

    <button type="submit" id="submitBtn">Register Student</button>
    <button type="reset">Reset Form</button>
    </form>
    </section>
</main>

<!-- Footer -->
<footer>

    <p>Student Management System</p>
</footer>

<script src="script.js"></script>
</body>
</html>
